name: Routeproxy 检查

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: routeproxy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: 格式
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        run: cargo test
      - name: 构建
        run: cargo build --release
      - name: 校验规则 seed
        run: cargo run --quiet -- rules check --file rules.toml
      - name: Shell 语法
        run: find packaging -name '*.sh' -print0 | xargs -0 -n1 sh -n
